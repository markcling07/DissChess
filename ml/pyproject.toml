[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptc-ml"
version = "0.1.0"
description = "Photo to Chess evaluation and training tools. Never deployed."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["ptc-vision"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "chess>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]
