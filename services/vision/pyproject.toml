[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptc-vision"
version = "0.1.0"
description = "Photo to Chess recognition service"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
    "numpy>=2.5,<3",
    "pillow>=13,<14",
    "opencv-python-headless>=5,<6",
    "onnxruntime>=1.31,<2",
    "fastapi>=0.162,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptc_vision = ["models/*.onnx", "models/*.json"]
